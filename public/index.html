<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DarkChat</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin:0; display:flex; height:100vh; }
      #login { margin:auto; text-align:center; }
      #chat { display:none; flex-direction:column; width:100%; max-width:800px; margin:auto; height:100%; }
      #messages { flex:1; overflow:auto; border:1px solid #ddd; padding:10px; margin-bottom:10px; }
      #input { display:flex; }
      #input input { flex:1; padding:8px; }
      #input button { padding:8px 12px; }
      .message { margin-bottom:8px; }
      .meta { color:#666; font-size:12px; }
      .system { color:#999; font-style:italic }
    </style>
  </head>
  <body>
    <div id="login">
      <h1>DarkChat</h1>
      <p>Introduce tu nombre para acceder al chat</p>
      <input id="name" placeholder="Tu nombre" />
      <button id="enter">Entrar</button>
    </div>

    <div id="chat">
      <h2 id="title">DarkChat</h2>
      <div id="messages"></div>
      <div id="input">
        <input id="msg" placeholder="Escribe un mensaje..." autocomplete="off" />
        <button id="send">Enviar</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>

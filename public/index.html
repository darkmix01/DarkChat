<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DarkChat - Mejorado</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
      :root{
        --bg:#08080b;
        --panel:#0f1114;
        --accent:#00ff99;
        --muted:#7a7f85;
        --bubble:#111418;
        --bubble-alt:#0d1820;
        --error:#ff4444;
        --success:#00ff99;
      }
      html,body{height:100%;}
      body{
        margin:0; font-family: 'Share Tech Mono', monospace, system-ui; background: linear-gradient(180deg,#050507 0%, #0b0b0f 60%); color:#e6eef1; display:flex; align-items:center; justify-content:center;
      }
      .wrap{width:100%; max-width:1200px; height:90vh; display:flex; gap:20px; padding:24px; box-sizing:border-box}

      /* Sidebar: salas y usuarios */
      #sidebar{
        flex: 0 0 280px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border: 1px solid rgba(255,255,255,0.03);
        padding: 16px;
        border-radius: 8px;
        overflow-y: auto;
      }

      #sidebar h3 {
        margin: 0 0 8px 0;
        color: var(--accent);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .rooms-list, .users-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 300px;
        overflow-y: auto;
      }

      .room-item, .user-item {
        padding: 10px 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        color: var(--muted);
        transition: all 0.2s;
      }

      .room-item:hover, .user-item:hover {
        background: rgba(255,255,255,0.05);
        border-color: var(--accent);
        color: var(--accent);
      }

      .room-item.active {
        background: rgba(0,255,153,0.1);
        border-color: var(--accent);
        color: var(--accent);
        font-weight: bold;
      }

      .user-item.typing {
        color: var(--accent);
        font-style: italic;
      }

      /* panel izquierdo: login */
      #login{flex:1; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); padding:24px; border-radius:8px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); display:flex; flex-direction:column; justify-content:center}
      #login h1{margin:0 0 8px; color:var(--accent); font-size:32px; text-shadow:0 0 8px rgba(0,255,153,0.12)}
      #login p{margin:0 0 16px; color:var(--muted); font-size:13px}
      #login input{width:100%; padding:12px; margin-bottom:12px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:inherit; border-radius:6px; font-family:inherit; box-sizing:border-box}
      #login select{width:100%; padding:12px; margin-bottom:12px; background:transparent; border:1px solid rgba(255,255,255,0.04); color:inherit; border-radius:6px; font-family:inherit; box-sizing:border-box}
      #login button{width:100%; padding:12px; border:0; background:linear-gradient(90deg,#00ff99,#00d18a); color:#001; font-weight:700; border-radius:6px; cursor:pointer; font-family:inherit; font-size:14px}
      #login button:hover{opacity:0.9}
      .error-msg{color:var(--error); font-size:12px; margin-bottom:8px; display:none}

      /* panel de chat */
      #chat{flex:1; display:flex; flex-direction:column; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:8px; border:1px solid rgba(255,255,255,0.03); display:none}
      #title{margin:12px 18px; color:var(--accent); font-size:18px; display:flex; justify-content:space-between; align-items:center}
      .chat-main{display:flex; flex-direction:column; flex:1; padding:12px; overflow:hidden}
      #messages{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; background:rgba(0,0,0,0.2)}

      .message{max-width:80%; padding:12px 14px; border-radius:10px; background:var(--bubble); box-shadow: 0 3px 10px rgba(0,0,0,0.6); color:#dffcf0; word-wrap:break-word}
      .message.other{align-self:flex-start; background:var(--bubble-alt); border:1px solid rgba(255,255,255,0.02)}
      .message.mine{align-self:flex-end; background:linear-gradient(90deg,#072617,#06311f); border:1px solid rgba(0,255,153,0.08)}
      .system{align-self:center; font-size:13px; color:#9ea6a8; font-style:italic; text-align:center}
      .meta{display:block; font-size:11px; color:var(--muted); margin-bottom:6px}
      .error{align-self:center; font-size:12px; color:var(--error); padding:8px 12px; background:rgba(255,68,68,0.1); border:1px solid rgba(255,68,68,0.3); border-radius:4px}

      #typing-indicator{font-size:12px; color:var(--muted); font-style:italic; padding:0 18px; height:20px}

      #input{display:flex; gap:10px; padding:12px; background:rgba(0,0,0,0.1)}
      #input input{flex:1; padding:12px; background:transparent; border:1px solid rgba(255,255,255,0.03); color:inherit; border-radius:8px; font-family:inherit; font-size:14px}
      #input button{padding:12px 16px; border-radius:8px; border:0; background:linear-gradient(90deg,#00ff99,#00d18a); color:#001; font-weight:700; cursor:pointer; font-family:inherit}
      #input button:hover{opacity:0.9}

      /* scrollbar */
      #messages::-webkit-scrollbar, .rooms-list::-webkit-scrollbar, .users-list::-webkit-scrollbar{width:8px}
      #messages::-webkit-scrollbar-thumb, .rooms-list::-webkit-scrollbar-thumb, .users-list::-webkit-scrollbar-thumb{background:linear-gradient(#071414,#0a2b21); border-radius:10px}

      @media (max-width:900px){
        .wrap{flex-direction:column;height:100vh;padding:8px}
        #sidebar{width:100%; max-height:200px}
        #login{width:100%}
        #chat{width:100%}
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Sidebar: Salas y Usuarios -->
      <div id="sidebar" style="display:none">
        <div>
          <h3>🏢 Salas</h3>
          <div id="rooms-list" class="rooms-list"></div>
        </div>
        <div>
          <h3>👥 Usuarios Conectados</h3>
          <div id="users-list" class="users-list"></div>
        </div>
      </div>

      <!-- Panel Login -->
      <div id="login">
        <h1>🌙 DarkChat</h1>
        <p>Chat en tiempo real con salas, historial y seguridad mejorada.</p>
        <div class="error-msg" id="error-msg"></div>
        <input id="name" placeholder="Tu alias (1-30 caracteres)" maxlength="30" />
        <select id="room" style="margin-bottom:12px">
          <option value="general">📍 General</option>
          <option value="tech">💻 Tech</option>
          <option value="gaming">🎮 Gaming</option>
          <option value="casual">☕ Casual</option>
        </select>
        <button id="enter">Entrar</button>
        <p style="font-size:11px;color:var(--muted);margin-top:12px;margin-bottom:0">✅ Mensajes persistentes • 🔒 Validación XSS • 🚀 Rate limiting</p>
      </div>

      <!-- Panel Chat -->
      <div id="chat">
        <div id="title">
          <span>DarkChat - <strong id="current-room">general</strong></span>
          <span id="users-count" style="font-size:12px; color:var(--muted)">👥 0</span>
        </div>
        <div class="chat-main">
          <div id="messages" aria-live="polite" aria-label="Mensajes del chat"></div>
          <div id="typing-indicator"></div>
          <div id="input">
            <input id="msg" placeholder="Escribe un mensaje..." autocomplete="off" />
            <button id="send">Enviar</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>

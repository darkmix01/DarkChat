<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>DarkChat - Mejorado</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
      
      :root{
        --bg:#08080b;
        --panel:#0f1114;
        --accent:#00ff99;
        --muted:#7a7f85;
        --bubble:#111418;
        --bubble-alt:#0d1820;
        --error:#ff4444;
        --warning:#ffaa44;
        --success:#00ff99;
        --info:#4499ff;
      }
      
      * { box-sizing: border-box; }
      
      html,body{
        height:100%;
        width: 100%;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      
      body{
        font-family: 'Share Tech Mono', monospace, system-ui;
        background: linear-gradient(180deg,#050507 0%, #0b0b0f 60%);
        color:#e6eef1;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow: hidden;
      }
      
      /* ALERTAS */
      .alert-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      
      .alert {
        padding: 14px 16px;
        border-radius: 8px;
        border-left: 4px solid;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        gap: 12px;
        animation: slideIn 0.3s ease-out;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        font-size: 13px;
      }
      
      .alert-icon {
        font-size: 18px;
        flex-shrink: 0;
        min-width: 20px;
      }
      
      .alert-content {
        flex: 1;
        line-height: 1.3;
      }
      
      .alert-close {
        cursor: pointer;
        font-size: 18px;
        color: var(--muted);
        transition: color 0.2s;
        background: none;
        border: none;
        padding: 0 4px;
        flex-shrink: 0;
      }
      
      .alert-close:hover {
        color: #fff;
      }
      
      .alert.error {
        border-left-color: var(--error);
        color: #ffcccc;
      }
      
      .alert.success {
        border-left-color: var(--success);
        color: #ccffee;
      }
      
      .alert.warning {
        border-left-color: var(--warning);
        color: #ffdd99;
      }
      
      .alert.info {
        border-left-color: var(--info);
        color: #ccddff;
      }
      
      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      
      @keyframes slideOut {
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }
      
      .alert.removing {
        animation: slideOut 0.3s ease-out forwards;
      }
      
      /* MAIN LAYOUT */
      .wrap{
        width:100%;
        height: 100vh;
        max-width:1400px;
        display:flex;
        gap:0;
        padding:0;
        overflow: hidden;
      }
      
      /* SIDEBAR - Responsive */
      #sidebar{
        flex: 0 0 280px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border-right: 1px solid rgba(255,255,255,0.03);
        padding: 16px;
        overflow-y: auto;
        transition: all 0.3s ease;
      }
      
      #sidebar.mobile-hidden {
        position: fixed;
        left: -300px;
        top: 0;
        height: 100vh;
        z-index: 100;
        width: 280px;
        border-radius: 0 8px 8px 0;
      }
      
      #sidebar.mobile-visible {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        z-index: 100;
        width: 280px;
      }
      
      #sidebar h3 {
        margin: 0 0 8px 0;
        color: var(--accent);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      .rooms-list, .users-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 300px;
        overflow-y: auto;
      }
      
      .room-item, .user-item {
        padding: 10px 12px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        color: var(--muted);
        transition: all 0.2s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      
      .room-item:hover, .user-item:hover {
        background: rgba(255,255,255,0.05);
        border-color: var(--accent);
        color: var(--accent);
      }
      
      .room-item.active {
        background: rgba(0,255,153,0.1);
        border-color: var(--accent);
        color: var(--accent);
        font-weight: bold;
      }
      
      .user-item.typing {
        color: var(--accent);
        font-style: italic;
      }
      
      /* LOGIN PANEL */
      #login-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      
      #login{
        background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border:1px solid rgba(255,255,255,0.03);
        padding:28px 24px;
        border-radius:8px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
      }
      
      #login h1{
        margin:0 0 12px 0;
        color:var(--accent);
        font-size:28px;
        text-shadow:0 0 8px rgba(0,255,153,0.12);
        line-height: 1.2;
      }
      
      #login p{
        margin:0 0 16px 0;
        color:var(--muted);
        font-size:12px;
        line-height: 1.4;
      }
      
      #login input, #login select {
        width:100%;
        padding:12px;
        margin-bottom:12px;
        background:transparent;
        border:1px solid rgba(255,255,255,0.04);
        color:inherit;
        border-radius:6px;
        font-family:inherit;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      
      #login input:focus, #login select:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(0,255,153,0.05);
      }
      
      #login button{
        width:100%;
        padding:12px;
        border:0;
        background:linear-gradient(90deg,#00ff99,#00d18a);
        color:#001;
        font-weight:700;
        border-radius:6px;
        cursor:pointer;
        font-family:inherit;
        font-size: 14px;
        transition: all 0.2s;
      }
      
      #login button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,255,153,0.3);
      }
      
      #login button:active {
        transform: translateY(0);
      }
      
      #login button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      
      /* CHAT PANEL */
      #chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      
      #chat{
        flex:1;
        display:flex;
        flex-direction:column;
        background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border-radius:0;
        border:0;
        overflow: hidden;
      }
      
      #title{
        padding:12px 18px;
        color:var(--accent);
        font-size:16px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        gap: 12px;
      }
      
      #title-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      #toggle-sidebar-btn {
        display: none;
        background: none;
        border: none;
        color: var(--accent);
        font-size: 20px;
        cursor: pointer;
        padding: 0 8px;
      }
      
      .chat-main{
        display:flex;
        flex-direction:column;
        flex:1;
        padding:0;
        overflow:hidden;
      }
      
      #messages{
        flex:1;
        overflow-y:auto;
        padding:16px;
        display:flex;
        flex-direction:column;
        gap:12px;
        background:rgba(0,0,0,0.2);
      }
      
      .message{
        max-width:85%;
        padding:12px 14px;
        border-radius:10px;
        background:var(--bubble);
        box-shadow: 0 3px 10px rgba(0,0,0,0.6);
        color:#dffcf0;
        word-wrap:break-word;
        line-height: 1.4;
      }
      
      .message.other{
        align-self:flex-start;
        background:var(--bubble-alt);
        border:1px solid rgba(255,255,255,0.02);
      }
      
      .message.mine{
        align-self:flex-end;
        background:linear-gradient(90deg,#072617,#06311f);
        border:1px solid rgba(0,255,153,0.08);
      }
      
      .message.system{
        align-self:center;
        font-size:12px;
        color:#9ea6a8;
        font-style:italic;
        text-align:center;
        max-width: 100%;
        background: transparent;
        box-shadow: none;
        border: none;
        padding: 8px 0;
      }
      
      .meta{
        display:block;
        font-size:10px;
        color:var(--muted);
        margin-bottom:4px;
      }
      
      #typing-indicator{
        font-size:11px;
        color:var(--muted);
        font-style:italic;
        padding:0 16px;
        height:20px;
        line-height: 20px;
      }
      
      #input{
        display:flex;
        gap:10px;
        padding:12px 16px;
        background:rgba(0,0,0,0.2);
        border-top: 1px solid rgba(255,255,255,0.03);
      }
      
      #input input{
        flex:1;
        padding:12px;
        background:transparent;
        border:1px solid rgba(255,255,255,0.03);
        color:inherit;
        border-radius:8px;
        font-family:inherit;
        font-size:14px;
        transition: border-color 0.2s;
      }
      
      #input input:focus {
        outline: none;
        border-color: var(--accent);
      }
      
      #input button{
        padding:12px 20px;
        border-radius:8px;
        border:0;
        background:linear-gradient(90deg,#00ff99,#00d18a);
        color:#001;
        font-weight:700;
        cursor:pointer;
        font-family:inherit;
        font-size: 14px;
        transition: all 0.2s;
        white-space: nowrap;
      }
      
      #input button:hover{
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0,255,153,0.3);
      }
      
      #input button:active {
        transform: translateY(0);
      }
      
      /* SCROLLBAR */
      #messages::-webkit-scrollbar,
      .rooms-list::-webkit-scrollbar,
      .users-list::-webkit-scrollbar {
        width: 6px;
      }
      
      #messages::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.1);
      }
      
      #messages::-webkit-scrollbar-thumb,
      .rooms-list::-webkit-scrollbar-thumb,
      .users-list::-webkit-scrollbar-thumb {
        background: linear-gradient(#071414,#0a2b21);
        border-radius: 3px;
      }
      
      /* MOBILE - 480px y menos */
      @media (max-width:480px) {
        .wrap {
          padding: 0;
        }
        
        #sidebar {
          display: none;
        }
        
        #sidebar.mobile-visible {
          display: flex;
        }
        
        #toggle-sidebar-btn {
          display: block;
        }
        
        #login-container {
          padding: 16px;
          align-items: flex-start;
          padding-top: max(60px, env(safe-area-inset-top));
        }
        
        #login {
          padding: 20px;
          border-radius: 0;
          max-width: 100%;
        }
        
        #login h1 {
          font-size: 24px;
          margin-bottom: 10px;
        }
        
        #login p {
          font-size: 11px;
          margin-bottom: 14px;
        }
        
        #login input, #login select {
          padding: 11px;
          font-size: 16px; /* Evita zoom en iOS */
          margin-bottom: 10px;
        }
        
        #login button {
          padding: 11px;
          font-size: 14px;
        }
        
        #title {
          padding: 10px 12px;
          font-size: 14px;
          gap: 8px;
        }
        
        #users-count {
          font-size: 11px !important;
        }
        
        .message {
          max-width: 90%;
          font-size: 13px;
          padding: 10px 12px;
        }
        
        .meta {
          font-size: 9px;
          margin-bottom: 3px;
        }
        
        #messages {
          padding: 12px;
          gap: 10px;
        }
        
        #input {
          gap: 8px;
          padding: 10px 12px;
        }
        
        #input input {
          padding: 10px;
          font-size: 16px;
        }
        
        #input button {
          padding: 10px 14px;
          font-size: 12px;
        }
        
        .alert-container {
          right: 10px;
          left: 10px;
          top: calc(10px + env(safe-area-inset-top));
          max-width: none;
        }
        
        .alert {
          padding: 12px 12px;
          font-size: 12px;
        }
        
        .alert-icon {
          font-size: 16px;
        }
      }
      
      /* TABLET - 481px a 900px */
      @media (max-width:900px) and (min-width:481px) {
        #sidebar {
          flex: 0 0 240px;
          padding: 12px;
        }
        
        #sidebar h3 {
          font-size: 11px;
        }
        
        .room-item, .user-item {
          font-size: 10px;
          padding: 8px 10px;
        }
        
        #login {
          max-width: 380px;
          padding: 24px;
        }
        
        #login h1 {
          font-size: 26px;
          margin-bottom: 10px;
        }
        
        #title {
          font-size: 15px;
          padding: 12px 16px;
        }
        
        .message {
          max-width: 80%;
          font-size: 13px;
        }
      }
      
      /* Overlay para sidebar mobile */
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.7);
        z-index: 99;
        backdrop-filter: blur(4px);
      }
      
      .sidebar-overlay.visible {
        display: block;
      }
      
      @media (max-width:480px) {
        .sidebar-overlay {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- ALERTAS -->
    <div class="alert-container" id="alert-container"></div>
    
    <!-- OVERLAY SIDEBAR MOBILE -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="wrap">
      <!-- SIDEBAR -->
      <div id="sidebar" class="mobile-hidden">
        <div>
          <h3>🏢 Salas</h3>
          <div id="rooms-list" class="rooms-list"></div>
        </div>
        <div style="margin-top: auto;">
          <h3>👥 Usuarios</h3>
          <div id="users-list" class="users-list"></div>
        </div>
      </div>
      
      <!-- LOGIN -->
      <div id="login-container" style="display:flex">
        <div id="login">
          <h1>🌙 DarkChat</h1>
          <p>Chat en tiempo real con salas, historial y seguridad.</p>
          <input id="name" placeholder="Alias (1-30)" maxlength="30" />
          <select id="room">
            <option value="general">📍 General</option>
            <option value="tech">💻 Tech</option>
            <option value="gaming">🎮 Gaming</option>
            <option value="casual">☕ Casual</option>
          </select>
          <button id="enter">Entrar</button>
          <p style="font-size:10px;color:var(--muted);margin-top:12px;margin-bottom:0">✅ Persistencia • 🔒 XSS • 🚀 Rate Limit</p>
        </div>
      </div>
      
      <!-- CHAT -->
      <div id="chat-container" style="display:none">
        <div id="chat">
          <div id="title">
            <div id="title-left">
              <button id="toggle-sidebar-btn" title="Salas y usuarios">≡</button>
              <span>DarkChat - <strong id="current-room">general</strong></span>
            </div>
            <span id="users-count" style="font-size:12px; color:var(--muted)">👥 0</span>
          </div>
          <div class="chat-main">
            <div id="messages" aria-live="polite" aria-label="Mensajes del chat"></div>
            <div id="typing-indicator"></div>
            <div id="input">
              <input id="msg" placeholder="Mensaje..." autocomplete="off" />
              <button id="send">↩</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DarkChat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="wrap">
      <section id="login" aria-labelledby="login-title">
        <h1 id="login-title">DarkChat</h1>
        <p>Accede con tu nombre. Diseño oscuro minimal.</p>

        <form id="loginForm" aria-label="Formulario de inicio de sesión">
          <label for="name" class="sr-only">Tu alias</label>
          <input id="name" name="name" placeholder="Tu alias" required aria-required="true" />
          <button id="enter" type="submit">Entrar</button>
        </form>

        <p style="font-size:12px;color:var(--muted);margin-top:12px">No se almacenan mensajes en el servidor por defecto.</p>
      </section>

      <section id="chat" style="display:none" aria-hidden="true">
        <h2 id="title">DarkChat</h2>
        <div class="chat-main">
          <main id="messages" role="log" aria-live="polite" aria-atomic="false"></main>

          <form id="composer" class="composer" aria-label="Enviar mensaje">
            <div id="input">
              <label for="msg" class="sr-only">Mensaje</label>
              <input id="msg" name="message" placeholder="Escribe un mensaje..." autocomplete="off" />
              <button id="send" type="submit">Enviar</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>
